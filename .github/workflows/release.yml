name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: |
          coverage run -m unittest discover -p '*tests.py' -v
          coverage report
      - run: pip-audit -r requirements.txt

  package-and-publish:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Build portable Windows executable
        run: python scripts/build_game.py
      - name: Smoke-test executable
        run: python scripts/smoke_packaged.py
      - name: Generate SHA-256 checksum
        run: python scripts/write_checksum.py
      - name: Attest executable provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/nine-mens-morris-windows-x64.exe
      - name: Attest checksum provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/SHA256SUMS.txt
      - name: Upload release build
        uses: actions/upload-artifact@v7
        with:
          name: nine-mens-morris-${{ github.ref_name }}
          path: |
            dist/nine-mens-morris-windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/nine-mens-morris-windows-x64.exe
          dist/SHA256SUMS.txt
          --verify-tag
          --generate-notes
          --title "Nine Men's Morris ${{ github.ref_name }}"
