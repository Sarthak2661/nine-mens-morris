name: Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEODRIVER: dummy

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test with enforced branch coverage
        run: |
          coverage run -m unittest discover -p '*tests.py' -v
          coverage report

      - name: Verify supported display matrix
        run: python scripts/verify_display.py

      - name: Upload display verification
        uses: actions/upload-artifact@v7
        with:
          name: display-verification
          path: resources/display-verification/
          if-no-files-found: error

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  package:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Build Windows executable
        run: python scripts/build_game.py

      - name: Smoke-test packaged executable
        run: python scripts/smoke_packaged.py

      - name: Generate release checksum
        run: python scripts/write_checksum.py

      - name: Upload clean-runner package
        uses: actions/upload-artifact@v7
        with:
          name: nine-mens-morris-windows-x64
          path: |
            dist/nine-mens-morris-windows-x64.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
