[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.14"
files = [
    "ai.py",
    "main.py",
    "logic.py",
    "constants.py",
    "GUI.py",
    "menu.py",
    "ui_theme.py",
    "sound_feedback.py",
    "game_persistence.py",
    "display.py",
]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["logic", "ai"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
